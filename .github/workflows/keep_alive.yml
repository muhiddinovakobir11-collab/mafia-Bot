name: Render 24/7 Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier spin down (sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s -f -m 30 "https://mafia-bot-abhf.onrender.com/ping" || echo "Ping request executed"

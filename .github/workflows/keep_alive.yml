name: Render 24/7 Keep Alive

on:
  schedule:
    # Har 10 daqiqada ishga tushadi (Render 15 daqiqada uxlab qolmasligi uchun)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Bot Service
        run: |
          echo "Pinging Render bot web service..."
          curl -s -L -m 45 "https://mafia-bot-abhf.onrender.com/" -o /dev/null -w "HTTP Status: %{http_code}\n"
          curl -s -L -m 45 "https://mafia-bot-abhf.onrender.com/ping" -o /dev/null -w "Ping Status: %{http_code}\n"
          echo "Render keep-alive ping muvaffaqiyatli bajarildi!"

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Bot Admin — Kirish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1035, #0a0612 80%);
        }
        .glass {
            background: rgba(26, 17, 43, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
    <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl shadow-purple-950/60 border border-purple-500/20">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-tr from-purple-600 to-indigo-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg shadow-purple-500/30">
                🎩
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">MAFIA BOT ADMIN</h1>
            <p class="text-xs text-purple-300/70 mt-1">Boshqaruv paneliga kirish uchun maxfiy kalitni kiriting</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-red-500/20 border border-red-500/40 text-red-300 text-sm text-center">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold text-purple-200 mb-2 uppercase tracking-wider">Admin Maxfiy Kaliti</label>
                <input type="password" name="secret_key" required placeholder="••••••••••••••••"
                       class="w-full px-4 py-3.5 rounded-xl bg-purple-950/50 border border-purple-500/30 text-white placeholder-purple-400/40 focus:outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-500/20 transition">
            </div>

            <button type="submit"
                    class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-purple-600/30 active:scale-[0.98] transition">
                TIZIMGA KIRISH ➔
            </button>
        </form>

        <div class="mt-8 text-center text-xs text-purple-400/50">
            Universal Mafia Bot &copy; 2026 • Barcha huquqlar himoyalangan
        </div>
    </div>
</body>
</html>
